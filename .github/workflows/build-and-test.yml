name: Build and test

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE
  workflow_dispatch:
    inputs:
      build_macos:
        description: Also build and test on macOS
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.build_macos && '["windows-latest","ubuntu-latest","macos-15"]' || '["windows-latest","ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - name: Install Linux GPU probe headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev
      - run: npm run build:probe
        if: runner.os != 'macOS'
      - name: Desktop regression (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Desktop regression
        if: runner.os != 'Linux'
        run: npm run test:desktop
